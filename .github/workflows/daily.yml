name: AutoClaw Daily

on:
  # 上游仓库默认不跑定时，避免空跑。
  # fork 后想启用定时：把下面两行取消注释（cron 用 UTC，北京时间 = UTC+8）。
  # 北京时间 每天 08:35
  # schedule:
  #   - cron: "35 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: AutoClaw-Daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run AutoClaw CN
        env:
          AUTOCLAW_CN_TOKENS: ${{ secrets.AUTOCLAW_CN_TOKENS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python autoclaw_cn_daily.py

      - name: Run AutoClaw INTL
        env:
          AUTOCLAW_INTL_TOKENS: ${{ secrets.AUTOCLAW_INTL_TOKENS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python autoclaw_intl_daily.py

